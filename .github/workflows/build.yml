name: Build binaries
on:
  push:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    name: lyset ${{ matrix.platform }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { platform: linux-x86_64, runner: ubuntu-24.04, binary: lyset }
          - { platform: windows-x86_64, runner: windows-2025, binary: lyset.exe }
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
        with:
          toolchain: 1.97.1
      - uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4
      - run: cargo test --locked
      - run: cargo build --release --locked
      # Package checks for the defects Word refuses or repairs (evidence in
      # tools/word-verify/README.md). Samples are anonymised production IRs.
      - name: Lint rendered DOCX samples
        if: matrix.platform == 'linux-x86_64'
        run: |
          mkdir -p target/samples
          for ir in tools/word-verify/samples/*.ir.json; do
            target/release/lyset render "$ir" --docx "target/samples/$(basename "$ir" .ir.json).docx"
          done
          python3 tools/word-verify/docxlint.py target/samples/*.docx
      - uses: actions/upload-artifact@v4
        with:
          name: lyset-${{ matrix.platform }}
          path: target/release/${{ matrix.binary }}
          if-no-files-found: error
