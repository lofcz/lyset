[package]
name = "lyset"
version = "0.1.0"
edition = "2021"
description = "Render a print-document IR to DOCX, PDF, and page PNGs via rdocx."
repository = "https://github.com/lofcz/lyset"

[dependencies]
# Sibling checkout: GitHub/rdocx. `system-fonts` is off so PDF/PNG output is
# deterministic (bundled Carlito / Caladea / Liberation).
rdocx = { path = "../rdocx/crates/rdocx", default-features = false }
oxml-media = { path = "../rdocx/crates/oxml-media" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.22"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
