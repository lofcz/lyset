[package]
name = "lyset"
version = "0.1.2"
edition = "2021"
description = "Render a print-document IR to DOCX, PDF, and page PNGs via rdocx."
repository = "https://github.com/lofcz/lyset"

[dependencies]
# `system-fonts` is off so PDF/PNG output is deterministic (bundled Carlito /
# Caladea / Liberation).
# Upstream S95.3 (rdocx 0.16.3), retaining the fork's export and math fixes.
rdocx = { git = "https://github.com/lofcz/rdocx", rev = "b969840f25fc13d5b0e361fbffbf768c5ccbd336", default-features = false }
oxml-media = { git = "https://github.com/lofcz/rdocx", rev = "b969840f25fc13d5b0e361fbffbf768c5ccbd336" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.22"
ttf-parser = "0.25.1"
unicode-segmentation = "1.12"

[dev-dependencies]
# Page-frame inspection in render tests.
oxml-layout = { git = "https://github.com/lofcz/rdocx", rev = "b969840f25fc13d5b0e361fbffbf768c5ccbd336", default-features = false }
# Reading package parts back in DOCX regression tests.
zip = { version = "8", default-features = false, features = ["deflate"] }

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
