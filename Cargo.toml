[package]
name = "rdocx-sidecar"
version = "0.1.0"
edition = "2021"
description = "Lyset: renders the ScioBot print-document IR (JSON) to DOCX / PDF / PNG via the sibling rdocx crate."
repository = "https://github.com/lofcz/lyset"

[[bin]]
name = "rdocx-sidecar"
path = "src/main.rs"

[dependencies]
# Sibling checkout: GitHub/rdocx. `system-fonts` is off on purpose so PDF/PNG
# output is deterministic across dev machines and servers (bundled Carlito /
# Caladea / Liberation are metric-compatible with Calibri / Cambria / Arial).
rdocx = { path = "../rdocx/crates/rdocx", default-features = false }
oxml-media = { path = "../rdocx/crates/oxml-media" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.22"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
