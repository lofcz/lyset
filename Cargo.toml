[package]
name = "lyset"
version = "0.1.0"
edition = "2021"
description = "Render a print-document IR to DOCX, PDF, and page PNGs via rdocx."
repository = "https://github.com/lofcz/lyset"

[dependencies]
# `system-fonts` is off so PDF/PNG output is deterministic (bundled Carlito /
# Caladea / Liberation).
rdocx = { git = "https://github.com/lofcz/rdocx", default-features = false }
oxml-media = { git = "https://github.com/lofcz/rdocx" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.22"

[dev-dependencies]
# Page-frame inspection in render tests.
oxml-layout = { git = "https://github.com/lofcz/rdocx" }

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
